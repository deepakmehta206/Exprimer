<section class="section highlights" #root>
  <div class="container highlights__intro">
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2 class="section-title">{{ data().title }}</h2>
    @if (data().subtitle) {
      <p class="section-subtitle">{{ data().subtitle }}</p>
    }
  </div>

  <div class="container highlights__grid">
    <div class="highlights__glow" aria-hidden="true"></div>
    @for (item of data().items; track item.title; let i = $index) {
      <article [attr.class]="'highlight-card highlight-card--' + accentFor(i, item.accent)">
        <span class="highlight-card__rim" aria-hidden="true"></span>
        @if (item.imageUrl) {
          <div class="highlight-card__media">
            <img [src]="item.imageUrl" [alt]="''" loading="lazy" />
          </div>
        } @else {
          <span class="highlight-card__index">{{ (i + 1).toString().padStart(2, '0') }}</span>
        }
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </article>
    }
  </div>
</section>
