<section class="section audiences" #root>
  <div class="container audiences__panel">
    <div class="audiences__glow" aria-hidden="true"></div>
    <div class="audiences__intro">
      <p class="eyebrow">{{ data().eyebrow }}</p>
      <h2 class="section-title">{{ data().title }}</h2>
    </div>
    <ul class="audiences__list">
      @for (item of data().items; track item.text) {
        <li class="audience-chip">{{ item.text }}</li>
      }
    </ul>
  </div>
</section>
