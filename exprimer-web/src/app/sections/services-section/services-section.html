<section class="services" [attr.id]="data().id || null" #root>
  <div class="container services__intro">
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2 class="section-title">{{ data().title }}</h2>
    <p class="section-subtitle">{{ data().subtitle }}</p>
  </div>

  <div class="services__strips">
    @for (item of data().items; track item.slug) {
      <a class="strip" [routerLink]="'/' + item.slug" [attr.data-accent]="item.accent">
        <div class="strip__media" aria-hidden="true">
          <img [src]="item.imageUrl || fallbackImage($index)" [alt]="''" />
          <div class="strip__scrim"></div>
        </div>
        <div class="strip__content container">
          <span class="strip__index">0{{ $index + 1 }}</span>
          <div class="strip__copy">
            <h3>{{ item.title }}</h3>
            <p>{{ item.summary }}</p>
          </div>
          <span class="strip__cta">Explore</span>
        </div>
      </a>
    }
  </div>
</section>
