<section class="section awards" #root>
  <div class="container awards__intro">
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2 class="section-title">{{ data().title }}</h2>
  </div>

  <div class="container awards__grid">
    <div class="awards__glow" aria-hidden="true"></div>
    @for (item of data().items; track item.name) {
      <article class="award-card">
        <span class="award-card__rim" aria-hidden="true"></span>
        <div class="award-card__media">
          <img [src]="item.imageUrl" [alt]="item.name" loading="lazy" />
        </div>
        @if (item.caption || item.name) {
          <p class="award-card__caption">{{ item.caption || item.name }}</p>
        }
      </article>
    }
  </div>
</section>
