<section class="section checks" [attr.id]="data().id || null" #root>
  <div class="container checks__intro">
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2 class="section-title">{{ data().title }}</h2>
    <p class="section-subtitle">{{ data().subtitle }}</p>
  </div>

  <div class="container checks__body">
    <div class="checks__glow" aria-hidden="true"></div>
    @for (group of data().groups; track group.title) {
      <div class="checks-group">
        <h3 class="checks-group__title">{{ group.title }}</h3>
        <div class="checks-group__grid">
          @for (item of group.items; track item.title) {
            <article class="check-card">
              <span class="check-card__rim" aria-hidden="true"></span>
              <div class="check-card__media">
                @if (item.imageUrl) {
                  <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" />
                } @else {
                  <img src="/brand/exprimer-logo.png" [alt]="''" loading="lazy" />
                }
              </div>
              <div class="check-card__copy">
                <h4>{{ item.title }}</h4>
                <p>{{ item.text }}</p>
              </div>
            </article>
          }
        </div>
      </div>
    }
  </div>
</section>
