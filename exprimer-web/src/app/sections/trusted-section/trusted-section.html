<section class="section trusted" #root>
  <div class="container">
    <div class="trusted__intro">
      <p class="eyebrow">{{ data().eyebrow }}</p>
      <h2 class="section-title">{{ data().title }}</h2>
    </div>
    <div class="trusted__grid">
      @for (item of data().items; track item.name) {
        <div class="trusted-card">
          <span>{{ item.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
