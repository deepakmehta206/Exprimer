<section class="section trusted" #root>
  <div class="container trusted__intro">
    <p class="eyebrow">{{ data().eyebrow }}</p>
    <h2 class="section-title">{{ data().title }}</h2>
  </div>

  <div class="trusted__marquee" [class.is-static]="reduceMotion()">
    <div class="trusted__glow" aria-hidden="true"></div>

    <div class="trusted__row trusted__row--a" aria-hidden="false">
      <div class="trusted__track">
        @for (item of loopItems(); track $index + '-a-' + item.name) {
          <div class="trusted-logo">
            @if (item.logoUrl) {
              <img [src]="item.logoUrl" [alt]="item.name" loading="lazy" />
            } @else {
              <span>{{ item.name }}</span>
            }
          </div>
        }
      </div>
    </div>

    <div class="trusted__row trusted__row--b" aria-hidden="true">
      <div class="trusted__track">
        @for (item of loopItems(); track $index + '-b-' + item.name) {
          <div class="trusted-logo">
            @if (item.logoUrl) {
              <img [src]="item.logoUrl" [alt]="''" loading="lazy" />
            } @else {
              <span>{{ item.name }}</span>
            }
          </div>
        }
      </div>
    </div>
  </div>
</section>
