<div class="glass-select" [class.is-open]="open()" [class.is-disabled]="disabled()">
  @if (open()) {
    <button type="button" class="glass-select__backdrop" aria-label="Close menu" (click)="close()"></button>
  }

  <button
    type="button"
    class="glass-select__trigger"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <span [class.is-placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder() }}
    </span>
    <i class="glass-select__chevron" aria-hidden="true"></i>
  </button>

  @if (open()) {
    <ul
      class="glass-select__menu"
      [class.is-above]="dropAbove()"
      role="listbox"
      [attr.aria-label]="ariaLabel()"
    >
      @for (option of options(); track option.value) {
        <li role="option" [attr.aria-selected]="option.value === value()">
          <button
            type="button"
            class="glass-select__option"
            [class.is-active]="option.value === value()"
            (click)="select(option)"
          >
            <span>{{ option.label }}</span>
            @if (option.value === value()) {
              <em>✓</em>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
