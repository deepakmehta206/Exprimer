<header class="header">
  <div class="container header__inner">
    <a routerLink="/home" class="brand" (click)="closeMenu()">
      <img
        class="brand__logo"
        src="/brand/exprimer-logo.png"
        alt="Exprimer Group of Companies"
        width="180"
        height="64"
      />
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      <span class="sr-only">Menu</span>
      <span></span><span></span>
    </button>

    <nav class="nav" [class.is-open]="menuOpen">
      <a routerLink="/home" routerLinkActive="is-active" (click)="closeMenu()">Home</a>
      <a routerLink="/media" routerLinkActive="is-active" (click)="closeMenu()">Media</a>
      <a routerLink="/recruitment" routerLinkActive="is-active" (click)="closeMenu()">Talent</a>
      <a routerLink="/verification" routerLinkActive="is-active" (click)="closeMenu()">Verify</a>
      <a
        class="nav__cta"
        routerLink="/home"
        fragment="contact"
        (click)="goToFragment($event, 'contact')"
      >
        Enquire
      </a>
    </nav>
  </div>
</header>
